# Netlify: statik sayt, build kerak emas
[build]
  publish = "."
  command = ""

# Barcha so'rovlar index.html ga (sahifalar #hash orqali ochiladi)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# JS/CSS fayl nomlarida versiya yo'q, shuning uchun har safar yangiligini tekshiradi
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Rasmlar kam o'zgaradi: bir hafta keshlanadi
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[dev]
  command = "python -m http.server 8000"
  port = 8000
  publish = "."
